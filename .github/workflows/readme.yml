name: Translate README

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # ISO Language Codes: https://cloud.google.com/translate/docs/languages
      - name: Adding README - Chinese Simplified
        uses: ./
        with:
          LANG: zh-CN
          LANG_NAME: 简体中文
          FLAG: cn
          SHOW_PERCENTAGE: false
      - name: Adding README - Chinese Traditional
        uses: ./
        with:
          LANG: zh-TW
          LANG_NAME: 繁体中文
          FLAG: tw
          SHOW_PERCENTAGE: false
      - name: Adding README - Hindi
        uses: ./
        with:
          LANG: hi
          LANG_NAME: हिंदी
          FLAG: in
          SHOW_PERCENTAGE: false
      - name: Adding README - Arabic
        uses: ./
        with:
          LANG: ar
          LANG_NAME: عربى
          FLAG: sa
          SHOW_PERCENTAGE: false
      - name: Adding README - French
        uses: ./
        with:
          LANG: fr
          LANG_NAME: Française
          FLAG: fr
          SHOW_PERCENTAGE: false
      - name: Adding README - Abjasio
        uses: ./
        with:
          LANG: ab
          LANG_NAME: Abjasio
          FLAG: ge
          SHOW_PERCENTAGE: false
      - name: Adding README - Achenés
        uses: ./
        with:
          LANG: ace
          LANG_NAME: Achenés
          FLAG: id
          SHOW_PERCENTAGE: false
      - name: Adding README - Acholí
        uses: ./
        with:
          LANG: ach
          LANG_NAME: Acholí
          FLAG: ug
          SHOW_PERCENTAGE: false
      - name: Adding README - Afrikaans
        uses: ./
        with:
          LANG: af
          LANG_NAME: Afrikaans
          FLAG: za
          SHOW_PERCENTAGE: false
      - name: Adding README - Albanés
        uses: ./
        with:
          LANG: sq
          LANG_NAME: Albanés
          FLAG: al
          SHOW_PERCENTAGE: false
