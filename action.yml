name: gh-translate-readme
author: Ephraim Atta-Duncan
description: Translate the Readme to another language

inputs:
  LANG:
    description: 'The Language you want to translate to'
    required: false
    default: 'zh-CN'
  PROVIDER:
    description: 'Translation provider to use (google, libretranslate)'
    required: false
    default: 'google'
  LIBRETRANSLATE_URL:
    description: 'LibreTranslate API URL'
    required: false
    default: 'http://localhost:5000'
  LIBRETRANSLATE_API_KEY:
    description: 'LibreTranslate API Key (optional)'
    required: false
    default: ''
  SOURCE_LANG:
    description: 'Source language code (default: auto)'
    required: false
    default: 'auto'
  IGNORE:
    description: 'Comma-separated language codes to skip (e.g. "fr,es")'
    required: false
    default: ''
  FLAG:
    description: 'Country/flag code for the language badge (e.g. "cn", "fr")'
    required: false
    default: ''
  LANG_NAME:
    description: 'Display name for the target language used in badges (optional)'
    required: false
    default: ''
  SHOW_PERCENTAGE:
    description: 'Show the translated percentage in language badges (true/false)'
    required: false
    default: 'true'
  SHOW_ICON:
    description: 'Show a circular progress icon instead of the percentage (true/false)'
    required: false
    default: 'false'
  BADGE_MODE:
    description: 'Badge display mode: "percentage" or "icon"'
    required: false
    default: 'percentage'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: book-open
  color: black
